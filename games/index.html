<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="A collection of games and interactive experiments by h4ry46.">
  <title>Games — h4ry46</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090909;
      --surface: #141414;
      --surface-hover: #1b1b1b;
      --border: #292929;
      --text: #f5f5f5;
      --muted: #929292;
      --soft: #c9c9c9;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% -18%, rgba(255,255,255,.075), transparent 48%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .page {
      width: min(820px, calc(100% - 40px));
      margin: 0 auto;
      padding: 76px 0 38px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 54px;
    }
    .brand {
      color: var(--muted);
      font-size: .82rem;
      letter-spacing: .04em;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--soft);
      font-size: .84rem;
      transition: color .2s ease;
    }
    .back:hover { color: #fff; }
    .hero { margin-bottom: 34px; }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 650;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4.2rem);
      line-height: 1;
      letter-spacing: -.065em;
      font-weight: 750;
    }
    .intro {
      max-width: 510px;
      margin: 17px 0 0;
      color: var(--muted);
      font-size: .96rem;
      line-height: 1.7;
    }
    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 13px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: .76rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    #gameCount { font-variant-numeric: tabular-nums; letter-spacing: 0; }
    .games { display: flex; flex-direction: column; gap: 12px; }
    .game {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) 34px;
      align-items: center;
      gap: 18px;
      min-height: 112px;
      padding: 17px 19px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: linear-gradient(110deg, #171717, #111);
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .game:hover {
      transform: translateY(-2px);
      border-color: #555;
      background: var(--surface-hover);
    }
    .game-icon {
      display: grid;
      width: 76px;
      height: 76px;
      place-items: center;
      overflow: hidden;
      border: 1px solid #303030;
      border-radius: 11px;
      background: #202020;
      color: #f2f2f2;
    }
    .game-icon img { width: 100%; height: 100%; object-fit: cover; }
    .game-icon svg { width: 29px; height: 29px; opacity: .8; }
    .game-info { min-width: 0; }
    .game-name {
      margin: 0 0 6px;
      overflow-wrap: anywhere;
      font-size: 1.05rem;
      font-weight: 680;
      letter-spacing: -.015em;
    }
    .game-description {
      margin: 0;
      color: var(--muted);
      font-size: .84rem;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .open-mark {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 1px solid #303030;
      border-radius: 9px;
      color: var(--soft);
      transition: color .2s ease, background .2s ease, border-color .2s ease;
    }
    .game:hover .open-mark { color: #090909; background: #fff; border-color: #fff; }
    .open-mark svg { width: 15px; height: 15px; }
    .state {
      padding: 34px 20px;
      border: 1px dashed #303030;
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
      font-size: .88rem;
      line-height: 1.6;
    }
    .state strong { display: block; margin-bottom: 5px; color: var(--soft); font-weight: 600; }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 44px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      color: #666;
      font-size: .75rem;
    }
    @media (max-width: 520px) {
      .page { width: min(100% - 28px, 820px); padding-top: 38px; }
      .topbar { margin-bottom: 43px; }
      .game { grid-template-columns: 60px minmax(0, 1fr) 30px; gap: 13px; padding: 13px; min-height: 88px; }
      .game-icon { width: 60px; height: 60px; border-radius: 9px; }
      .game-name { font-size: .98rem; }
      .game-description { font-size: .79rem; }
      footer { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0s !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="topbar" aria-label="Navigation">
      <a class="brand" href="../">h4ry46 / MAINPAGE</a>
      <a class="back" href="../">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/><path d="M20 12H9"/></svg>
        Back to hub
      </a>
    </nav>

    <header class="hero">
      <p class="eyebrow">Personal arcade</p>
      <h1>Games<span style="color:#777">.</span></h1>
      <p class="intro">A collection of games and small interactive experiments. Pick one and have fun.</p>
    </header>

    <section aria-label="Game library">
      <div class="list-heading">
        <span>Library</span>
        <span id="gameCount">Loading…</span>
      </div>
      <div class="games" id="games">
        <div class="state">Looking for games…</div>
      </div>
    </section>

    <footer>
      <span>© <span id="year"></span> h4ry46</span>
      <span>Built for the web.</span>
    </footer>
  </main>

  <script>
    // Update these only if the repository or branch changes.
    const OWNER = "h4ry46";
    const REPO = "mainpage";
    const BRANCH = "main";
    const ROOT = "games";

    const list = document.getElementById("games");
    const count = document.getElementById("gameCount");
    document.getElementById("year").textContent = new Date().getFullYear();

    const fallbackIcon = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 11h4m-2-2v4m7-2h.01m3-.01h.01"/>
        <path d="M7 6h10a4 4 0 0 1 3.9 3.1l1 5A3 3 0 0 1 19 17.7l-3-2.2H8l-3 2.2a3 3 0 0 1-4.9-2.6l1-5A4 4 0 0 1 5 6Z"/>
      </svg>`;

    function showState(title, detail) {
      list.replaceChildren();
      const box = document.createElement("div");
      box.className = "state";
      const strong = document.createElement("strong");
      strong.textContent = title;
      const message = document.createElement("span");
      message.textContent = detail;
      box.append(strong, message);
      list.append(box);
    }

    function prettify(folder) {
      return folder
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function safeRelativePath(folder, path) {
      if (typeof path !== "string" || !path.trim()) return null;
      // Icons must stay inside their own game folder.
      const clean = path.trim().replace(/^\.\/+/, "");
      if (clean.startsWith("/") || clean.split("/").some(part => part === "..")) return null;
      return `/${ROOT}/${encodeURIComponent(folder)}/${clean.split("/").map(encodeURIComponent).join("/")}`;
    }

    function createCard(folder, metadata, files) {
      const name = typeof metadata.name === "string" && metadata.name.trim()
        ? metadata.name.trim() : prettify(folder);
      const description = typeof metadata.description === "string" && metadata.description.trim()
        ? metadata.description.trim() : "An interactive game. Open to play.";

      const card = document.createElement("a");
      card.className = "game";
      card.href = `./${encodeURIComponent(folder)}/`;
      card.setAttribute("aria-label", `Play ${name}`);

      const iconBox = document.createElement("div");
      iconBox.className = "game-icon";

      let iconPath = safeRelativePath(folder, metadata.icon);
      if (!iconPath) {
        const iconFile = files.find(file => /^icon\.(png|jpe?g|webp|gif|svg)$/i.test(file.name));
        if (iconFile) iconPath = `/${ROOT}/${encodeURIComponent(folder)}/${encodeURIComponent(iconFile.name)}`;
      }

      if (iconPath) {
        const img = document.createElement("img");
        img.src = iconPath;
        img.alt = "";
        img.loading = "lazy";
        img.onerror = () => { iconBox.innerHTML = fallbackIcon; };
        iconBox.append(img);
      } else {
        iconBox.innerHTML = fallbackIcon;
      }

      const info = document.createElement("div");
      info.className = "game-info";
      const title = document.createElement("h2");
      title.className = "game-name";
      title.textContent = name;
      const desc = document.createElement("p");
      desc.className = "game-description";
      desc.textContent = description;
      info.append(title, desc);

      const mark = document.createElement("span");
      mark.className = "open-mark";
      mark.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>';

      card.append(iconBox, info, mark);
      return card;
    }

    async function loadGames() {
      const api = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
      try {
        const response = await fetch(api, {
          headers: { "Accept": "application/vnd.github+json" }
        });
        if (!response.ok) {
          if (response.status === 403 || response.status === 429) {
            throw new Error("GitHub API rate limit reached. Please try again later.");
          }
          if (response.status === 404) throw new Error("Repository, branch, or games directory was not found.");
          throw new Error(`GitHub API returned HTTP ${response.status}.`);
        }

        const data = await response.json();
        if (data.truncated) throw new Error("The repository is too large for a complete automatic scan.");

        const files = Array.isArray(data.tree) ? data.tree : [];
        const prefix = `${ROOT}/`;
        const gameFolders = [...new Set(
          files
            .filter(item => item.type === "blob" && item.path.startsWith(prefix))
            .map(item => item.path.slice(prefix.length).split("/")[0])
            .filter(folder => folder && !folder.includes("."))
        )];

        const games = gameFolders
          .filter(folder => files.some(item => item.type === "blob" && item.path === `${ROOT}/${folder}/index.html`))
          .map(folder => ({
            folder,
            files: files
              .filter(item => item.type === "blob" && item.path.startsWith(`${ROOT}/${folder}/`))
              .map(item => ({ name: item.path.slice(`${ROOT}/${folder}/`.length) }))
          }));

        if (!games.length) {
          count.textContent = "0 games";
          showState("No games yet", "Add a subfolder inside /games with an index.html file.");
          return;
        }

        const results = await Promise.all(games.map(async game => {
          const metadataFile = game.files.find(file => file.name === "game.json");
          if (!metadataFile) return { ...game, metadata: {} };

          const rawUrl = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${ROOT}/${encodeURIComponent(game.folder)}/game.json`;
          try {
            const metadataResponse = await fetch(rawUrl);
            if (!metadataResponse.ok) return { ...game, metadata: {} };
            const metadata = await metadataResponse.json();
            return { ...game, metadata: metadata && typeof metadata === "object" ? metadata : {} };
          } catch {
            return { ...game, metadata: {} };
          }
        }));

        results.sort((a, b) => {
          const aName = (a.metadata.name || prettify(a.folder)).toString();
          const bName = (b.metadata.name || prettify(b.folder)).toString();
          return aName.localeCompare(bName);
        });

        list.replaceChildren(...results.map(game => createCard(game.folder, game.metadata, game.files)));
        count.textContent = `${results.length} ${results.length === 1 ? "game" : "games"}`;
      } catch (error) {
        count.textContent = "Unavailable";
        showState("Couldn't load the library", error.message || "Please refresh the page and try again.");
      }
    }

    loadGames();
  </script>
</body>
</html>
