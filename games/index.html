<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>h4rry46 — Hub &amp; Portal</title>

<meta name="description" content="Central hub for Đoàn Đức Hạnh (h4rry46) — linking to Bio, Immich Photos, and upcoming projects." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  :root {
    --background: oklch(0.99 0 0);
    --foreground: oklch(0.15 0 0);
    --card: oklch(0.98 0.005 240);
    --secondary: oklch(0.96 0.01 240);
    --muted-foreground: oklch(0.45 0.01 240);
    --accent: oklch(0.55 0.22 240);
    --accent-foreground: oklch(0.99 0 0);
    --border: oklch(0.9 0.01 240);
  }
  .dark {
    --background: oklch(0.12 0.01 264);
    --foreground: oklch(0.95 0 0);
    --card: oklch(0.15 0.01 264);
    --secondary: oklch(0.2 0.01 264);
    --muted-foreground: oklch(0.6 0 0);
    --accent: oklch(0.65 0.2 240);
    --accent-foreground: oklch(0.95 0 0);
    --border: oklch(0.22 0.01 264);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  html:not(.dark) { color-scheme: light; }
  body {
    font-family: 'Poppins', system-ui, sans-serif;
    background: var(--background);
    color: var(--foreground);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: background-color .3s, color .3s;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    top: -15%;
    left: 50%;
    transform: translateX(-50%);
    width: 680px;
    height: 380px;
    background: radial-gradient(circle, color-mix(in oklch, var(--accent) 16%, transparent) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
  svg.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .theme-toggle {
    position: fixed; top: 20px; right: 20px; z-index: 50;
    width: 48px; height: 48px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); box-shadow: 0 10px 15px -3px rgb(0 0 0 / .2);
    transition: background-color .2s, color .2s;
  }
  .theme-toggle:hover { background: var(--accent); color: var(--accent-foreground); }

  .hub {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 58rem;
    margin: 0 auto;
    padding: 48px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 36rem;
  }
  .avatar {
    position: relative;
    width: 112px;
    height: 112px;
    margin-bottom: 20px;
  }
  .avatar-glow {
    position: absolute;
    inset: -3px;
    border-radius: 28px;
    background: linear-gradient(135deg, var(--accent), color-mix(in oklch, var(--accent) 20%, transparent), transparent);
    animation: pulse-slow 3s ease-in-out infinite;
  }
  .avatar-img {
    position: absolute;
    inset: 2px;
    border-radius: 25px;
    background: var(--secondary);
    overflow: hidden;
  }
  .avatar-img img { width: 100%; height: 100%; object-fit: cover; }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: .75rem;
    font-weight: 500;
    color: var(--accent);
    background: color-mix(in oklch, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in oklch, var(--accent) 25%, transparent);
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }
  .hero h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .hero p {
    font-size: .9375rem;
    color: var(--muted-foreground);
  }

  .portal-grid {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .portal-card {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 24px;
    padding: 28px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    overflow: hidden;
  }
  .portal-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, color-mix(in oklch, var(--accent) 8%, transparent), transparent 60%);
    opacity: 0;
    transition: opacity .25s ease;
    pointer-events: none;
  }
  .portal-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 20px 30px -10px color-mix(in oklch, var(--accent) 18%, transparent);
  }
  .portal-card:hover::after { opacity: 1; }
  .portal-card.coming-soon {
    opacity: .72;
    cursor: default;
  }
  .portal-card.coming-soon:hover {
    transform: none;
    border-color: var(--border);
    box-shadow: none;
  }
  .portal-card.coming-soon:hover::after { opacity: 0; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: var(--secondary);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    transition: background-color .25s, color .25s;
  }
  .portal-card:not(.coming-soon):hover .card-icon {
    background: var(--accent);
    color: var(--accent-foreground);
  }
  .card-icon svg.icon { width: 24px; height: 24px; }
  .domain-tag {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: .8125rem;
    font-weight: 600;
    color: var(--accent);
    background: color-mix(in oklch, var(--accent) 10%, transparent);
    padding: 5px 12px;
    border-radius: 8px;
    border: 1px solid color-mix(in oklch, var(--accent) 20%, transparent);
  }
  .card-body h2 {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .host-badge {
    font-size: .7rem;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 6px;
    background: var(--secondary);
    border: 1px solid var(--border);
    color: var(--muted-foreground);
  }
  .card-body p {
    font-size: .875rem;
    color: var(--muted-foreground);
    line-height: 1.6;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: .875rem;
    font-weight: 500;
    color: var(--accent);
  }
  .portal-card.coming-soon .card-footer {
    color: var(--muted-foreground);
  }
  .card-footer svg.icon {
    width: 18px;
    height: 18px;
    transition: transform .2s ease;
  }
  .portal-card:not(.coming-soon):hover .card-footer svg.icon {
    transform: translate(3px, -3px);
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 14px;
  }
  .socials a {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color .2s, color .2s, border-color .2s;
  }
  .socials a:hover {
    background: var(--accent);
    color: var(--accent-foreground);
    border-color: var(--accent);
  }
  footer.hub-footer {
    text-align: center;
    font-size: .8125rem;
    color: var(--muted-foreground);
  }

  @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) {
    .avatar-glow { animation: none; }
    *, *::before, *::after { transition-duration: 0s !important; }
  }
  @media (min-width: 768px) {
    .hero h1 { font-size: 2.25rem; }
    .portal-grid { grid-template-columns: repeat(2, 1fr); gap: 24px; }
    .portal-card.span-full { grid-column: 1 / -1; }
  }
</style>
</head>
