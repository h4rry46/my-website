<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>h4rry46 — Game Arcade</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090b;
            --card-bg: #121215;
            --card-hover: #18181c;
            --border-color: #27272a;
            --border-hover: #3f3f46;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --accent: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 640px;
        }

        /* Header giống phong cách Hub & Portal */
        .header {
            margin-bottom: 2.5rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            transition: color 0.2s ease;
        }

        .back-btn:hover {
            color: var(--text-primary);
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            margin-bottom: 0.75rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Danh sách thẻ game */
        .hub-list {
            display: flex;
            flex-direction: column;
            gap: 0.875rem;
        }

        .hub-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.15rem 1.35rem;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hub-card:hover {
            background-color: var(--card-hover);
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .card-info h2 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.15rem;
        }

        .card-info p {
            font-size: 0.825rem;
            color: var(--text-secondary);
        }

        .card-arrow {
            color: var(--text-secondary);
            font-size: 1.1rem;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .hub-card:hover .card-arrow {
            transform: translateX(4px);
            color: var(--text-primary);
        }

        /* Trạng thái tải */
        .status-msg {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            border: 1px dashed var(--border-color);
            border-radius: 12px;
        }

        /* Footer đồng bộ bản quyền */
        footer {
            margin-top: 3.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <a href="/" class="back-btn">← Back to Hub</a>
            <div>
                <span class="badge">@h4rry46 • Web Games</span>
            </div>
            <h1>Game Portal</h1>
            <p class="subtitle">Mini-games & interactive web experiments hosted on my network.</p>
        </header>

        <main id="game-list" class="hub-list">
            <div class="status-msg">Scanning game directories...</div>
        </main>

        <footer>
            © 2026 Đoàn Đức Hạnh (h4rry46). All rights reserved.
        </footer>
    </div>

    <script>
        async function loadGames() {
            const container = document.getElementById('game-list');
            const apiUrl = 'https://github.com';

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('API Error');
                
                const items = await response.json();
                const gameFolders = items.filter(item => item.type === 'dir');

                if (gameFolders.length === 0) {
                    container.innerHTML = '<div class="status-msg">No games deployed yet.</div>';
                    return;
                }

                container.innerHTML = '';
                gameFolders.forEach(folder => {
                    // Format tên thư mục thành tiêu đề đẹp mắt (vd: 1in8billion -> 1in8billion)
                    const displayName = folder.name.replace(/-/g, ' ');
                    
                    const card = document.createElement('a');
                    card.href = `/game/${folder.name}/`;
                    card.className = 'hub-card';
                    card.innerHTML = `
                        <div class="card-left">
                            <div class="card-icon">🎮</div>
                            <div class="card-info">
                                <h2>${displayName}</h2>
                                <p>/game/${folder.name}</p>
                            </div>
                        </div>
                        <span class="card-arrow">→</span>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="status-msg">Unable to load games right now. Please try again later.</div>';
            }
        }

        loadGames();
    </script>
</body>
</html>
