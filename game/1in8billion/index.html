<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Test 1in8b API (Bảo mật)</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
  </style>
</head>
<body>
  <h2>Thử nghiệm 1in8b.life API</h2>
  <button id="btnFetch" onclick="fetchLife()">Tạo một cuộc đời ngẫu nhiên (Việt Nam)</button>
  <pre id="result">Nhấn nút ở trên để xem kết quả...</pre>

  <script>
    const WORKER_URL = 'https://workers.dev';

    async function fetchLife(retries = 3) {
      const resultBox = document.getElementById('result');
      const btn = document.getElementById('btnFetch');
      btn.disabled = true;
      resultBox.textContent = 'Đang tải dữ liệu...';

      for (let i = 1; i <= retries; i++) {
        try {
          const response = await fetch(`${WORKER_URL}?country=VNM&year=2000&record=1`);
          const data = await response.json();

          if (response.status === 503 && i < retries) {
            resultBox.textContent = `Server đang bận (503), đang tự động thử lại lần ${i + 1}/${retries}...`;
            await new Promise(r => setTimeout(r, 2000)); // Đợi 2 giây trước khi gọi lại
            continue;
          }

          resultBox.textContent = JSON.stringify(data, null, 2);
          break;
        } catch (error) {
          resultBox.textContent = 'Lỗi kết nối: ' + error.message;
          break;
        }
      }
      btn.disabled = false;
    }
  </script>
</body>
</html>
