  <div class="tl-item"><h4>${esc(it.title)}</h4><p class="period">${it.period}</p><p class="desc">${esc(it.description)}</p></div>`).join('')}</div>`;
document.getElementById('panel-resume').innerHTML = `
  ${heading('Resume')}
  <div><div class="heading-icon">${icon('bookOpen')}<h3 class="subtitle">Education &amp; Certifications</h3></div>${timeline(resume.education)}</div>
  <div>
    <h3 class="subtitle">Skills &amp; Languages</h3>
    <div class="skills">${resume.skills.map((s) => `
      <div>
        <div class="skill-head"><span>${s.name}</span><span class="muted">${s.level}%</span></div>
        <div class="track" role="progressbar" aria-label="${s.name}" aria-valuenow="${s.level}" aria-valuemin="0" aria-valuemax="100"><div class="fill" data-level="${s.level}"></div></div>
      </div>`).join('')}
    </div>
  </div>`;

const portfolioPanel = document.getElementById('panel-portfolio');
if (portfolio.projects.length === 0) {
  portfolioPanel.innerHTML = `
    ${heading('Portfolio')}
    <p class="prose">Projects coming soon...</p>`;
} else {
  portfolioPanel.innerHTML = `
    ${heading('Portfolio')}
    <div class="filters" role="group" aria-label="Filter projects">${portfolio.categories.map((c, i) => `
      <button type="button" class="filter" data-filter="${c}" aria-pressed="${i === 0}">${c}</button>`).join('')}
    </div>
    <div class="grid-3" id="projectGrid"></div>`;
  const renderProjects = (filter) => {
    const list = filter === 'all' ? portfolio.projects : portfolio.projects.filter((p) => p.category === filter);
    document.getElementById('projectGrid').innerHTML = list.map((p) => `
      <div class="project">
        <div class="thumb"><img src="${p.image}" alt="${esc(p.title)}"></div>
        <div class="overlay">
          <h3>${esc(p.title)}</h3>
          <div class="actions">
            <a class="btn-sm btn-primary" href="${p.liveUrl}" target="_blank" rel="noopener noreferrer">${icon('eye')}Preview</a>
            <a class="btn-sm btn-outline" href="${p.githubUrl}" target="_blank" rel="noopener noreferrer">${icon('externalLink')}Visit</a>
          </div>
        </div>
        <div class="badge">${p.category}</div>
      </div>`).join('');
  };
  renderProjects('all');
  portfolioPanel.querySelectorAll('.filter').forEach((btn) => btn.addEventListener('click', () => {
    portfolioPanel.querySelectorAll('.filter').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
    renderProjects(btn.dataset.filter);
  }));
}

document.getElementById('panel-blog').innerHTML = blog.length === 0
  ? `${heading('Blog')}<p class="prose">Posts coming soon...</p>`
  : `${heading('Blog')}
  <div class="grid-3">${blog.map((p) => `
    <article class="post">
      <div class="thumb"><img src="${p.image}" alt="${esc(p.title)}"></div>
      <div class="post-body">
        <div class="meta"><span class="pill">${p.category}</span><span>${icon('calendar')}${p.date}</span><span>${icon('clock')}${p.readTime}</span></div>
        <h3>${esc(p.title)}</h3>
        <p class="excerpt">${esc(p.excerpt)}</p>
        <div class="tags">${p.tags.map((t) => `<span>${esc(t)}</span>`).join('')}</div>
        <a class="read-more" href="#">Read More${icon('arrowRight')}</a>
      </div>
    </article>`).join('')}
  </div>`;

document.getElementById('panel-contact').innerHTML = `
  ${heading('Contact')}
  <div class="map"><iframe data-src="${contact.mapEmbedUrl}" title="Office Location" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
  <div class="contact-cards">
    <div class="contact-card"><div class="ci">${icon('mail')}</div><div><h3>Email</h3><a href="mailto:${contact.email}">${contact.email}</a></div></div>
    <div class="contact-card"><div class="ci">${icon('phone')}</div><div><h3>Phone</h3><a href="tel:${tel(contact.phone)}">${esc(contact.phone)}</a></div></div>
    <div class="contact-card"><div class="ci">${icon('mapPin')}</div><div><h3>Location</h3><p>${contact.location}</p></div></div>
  </div>
  <form id="contactForm" novalidate>
    <div class="form-row">
      <div><label for="name">Full Name</label><input class="field" type="text" id="name" name="name" placeholder="Harry" autocomplete="name" required></div>
      <div><label for="email">Email Address</label><input class="field" type="email" id="email" name="email" placeholder="harry@example.com" autocomplete="email" required></div>
    </div>
    <div><label for="message">Your Message</label><textarea class="field" id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea></div>
    <button type="submit" class="submit">${icon('send')}Send Message</button>
    <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
  </form>`;

document.getElementById('contactForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const form = e.currentTarget;
  if (!form.checkValidity()) { form.reportValidity(); return; }
  const { name, email, message } = Object.fromEntries(new FormData(form));
  const subject = encodeURIComponent(`Message from ${name}`);
  const body = encodeURIComponent(`${message}\n\n— ${name} (${email})`);
  window.location.href = `mailto:${contact.email}?subject=${subject}&body=${body}`;
  document.getElementById('formStatus').textContent = 'Thanks! Your email app should open with the message ready to send.';
  form.reset();
});

const sections = ['about', 'resume', 'portfolio', 'blog', 'contact'];
const tabs = document.getElementById('tabs');
tabs.innerHTML = sections.map((s, i) => `
  <button type="button" class="tab" role="tab" id="tab-${s}" aria-controls="panel-${s}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}">${s}</button>`).join('');
const activate = (name) => {
  sections.forEach((s) => {
    const on = s === name;
    const tab = document.getElementById(`tab-${s}`);
    tab.setAttribute('aria-selected', String(on));
    tab.tabIndex = on ? 0 : -1;
    document.getElementById(`panel-${s}`).hidden = !on;
  });
  if (name === 'resume') {
    document.querySelectorAll('.fill').forEach((f) => {
      f.style.width = '0';
      requestAnimationFrame(() => requestAnimationFrame(() => { f.style.width = f.dataset.level + '%'; }));
    });
  }
  if (name === 'contact') {
    const iframe = document.querySelector('.map iframe');
    if (!iframe.src) iframe.src = iframe.dataset.src;
  }
};
tabs.addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (btn) activate(btn.id.replace('tab-', ''));
});
tabs.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const current = sections.findIndex((s) => document.getElementById(`tab-${s}`).getAttribute('aria-selected') === 'true');
  const next = sections[(current + (e.key === 'ArrowRight' ? 1 : -1) + sections.length) % sections.length];
  activate(next);
  document.getElementById(`tab-${next}`).focus();
});

const toggle = document.getElementById('themeToggle');
let theme = 'dark';
try { theme = localStorage.getItem('theme') || 'dark'; } catch {}
const applyTheme = () => {
  document.documentElement.classList.toggle('dark', theme === 'dark');
  toggle.innerHTML = icon(theme === 'dark' ? 'sun' : 'moon');
};
applyTheme();
toggle.addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  try { localStorage.setItem('theme', theme); } catch {}
});
</script>
</body>
</html>
